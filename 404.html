<!DOCTYPE html>
<html lang="ckb" dir="rtl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پەڕەکە نەدۆزرایەوە (404) | نەخشەڕێگای گەشەپێدەری Backend</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Apply theme before render to avoid flash
      if (
        localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)
      ) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-[#101423] dark:text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">
    <!-- Header -->
    <header class="py-6 px-4 sm:px-8 border-b border-slate-200 dark:border-slate-800">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <a href="./" class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <ellipse cx="12" cy="5" rx="9" ry="3" stroke-width="2" />
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" stroke-width="2" />
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" stroke-width="2" />
            </svg>
          </div>
          <span class="font-bold text-lg text-slate-900 dark:text-white">Backend Roadmap</span>
        </a>
      </div>
    </header>

    <!-- Main 404 content -->
    <main class="flex-grow flex items-center justify-center px-4 py-16">
      <div class="text-center max-w-lg mx-auto p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl">
        <div class="text-7xl sm:text-8xl font-black font-mono text-indigo-600 dark:text-indigo-400 mb-4 tracking-wider">
          404
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mb-3">
          پەڕەکە نەدۆزرایەوە
        </h1>
        <p class="text-slate-600 dark:text-slate-400 mb-8 leading-relaxed">
          ببورە، ئەو ناونیشانەی کە بەدوایدا دەگەڕێیت بوونی نییە یان گۆڕدراوە. دەتوانیت بگەڕێیتەوە بۆ پەڕەی سەرەکی نەخشەڕێگاکە.
        </p>
        <a
          href="./"
          class="inline-flex items-center gap-2 px-6 py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md transition-all active:scale-95"
        >
          <span>گەڕانەوە بۆ پەڕەی سەرەکی</span>
          <span class="icon-flip">&rarr;</span>
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-200 dark:border-slate-800">
      &copy; 2026 نەخشەڕێگای PHP & MySQL. مافی بڵاوکردنەوە پارێزراوە.
    </footer>
  </body>
</html>
